<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Desenho - DevPortfolio</title>
  <link rel="stylesheet" href="/css/style.css">
 
</head>
<body>

  <div class="form-container">
    <h2>Adicionar Novo Desenho</h2>
    
    <form id="projectForm">
      <div class="form-group">
        <label for="title">Título do Desenho *</label>
        <input type="text" id="title" placeholder="Ex: Ilustração Fantasia" required>
      </div>

      <div class="form-group">
        <label for="description">Descrição</label>
        <textarea id="description" rows="3" placeholder="Detalhes sobre a arte, materiais ou conceito..."></textarea>
      </div>

      <div class="form-group">
        <label for="image_url">URL da Imagem *</label>
        <input type="text" id="image_url" placeholder="/imagem/foto.jpg ou https://..." required>
      </div>

      <button type="submit" class="btn-submit">Guardar Desenho</button>
    </form>

    <a href="/dashboard/projects.html" class="back-link">← Voltar aos Projetos</a>
  </div>

  <script src="/js/projects.js"></script>
</body>
</html>
