<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — DevPortfolio</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header>
    <h1>DevPortfolio — Painel de Controlo</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="projects.html">Meus Projetos</a>
      <a href="profile.html">Perfil</a>
      <button id="logoutBtn">Sair</button>
      <button onclick="trocarTema()">🌓 </button>
    </nav>
  </header>

  <main class="container">
    <section class="welcome-card">
      <h2>Bem-vindo(a), <span id="userNameDisplay">Formando</span>! 👋</h2>
      <p>Gerencia os teus projetos e atualiza o teu perfil público a partir deste painel.</p>
    </section>

    <section class="dashboard-actions" style="margin-top: 20px; display: flex; gap: 15px;">
      <a href="project-form.html" class="btn-primary" style="text-decoration: none; padding: 10px 15px; border-radius: 5px;">➕ Adicionar Novo Projeto</a>
      <a href="projects.html" class="btn-secondary" style="text-decoration: none; padding: 10px 15px; border-radius: 5px;">📁 Gerir Meus Projetos</a>
    </section>
  </main>

  <script src="../js/theme.js"></script>
  <script src="../js/main.js"></script>
  <script>
    // Verificar se o utilizador tem sessão iniciada
    const user = JSON.parse(localStorage.getItem('user'));
    
    if (!user) {
      // Se não estiver autenticado, redireciona para o login
      window.location.href = '../login.html';
    } else {
      // Apresentar o nome do utilizador
      document.getElementById('userNameDisplay').textContent = user.name || user.email;
    }

    // Botão de Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('user');
      window.location.href = '../login.html';
    });
  </script>
</body>
</html>
