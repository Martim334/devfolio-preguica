<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DevPortfolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>DevPortfolio</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="register.html">Registo</a>
      <button onclick="document.body.classList.toggle('dark')"> 🌓</button>
    </nav>
  </header>

<main class="form-container">
  <div class="form-card">
    <h2>Iniciar Sessão</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mail *</label>
        <input type="email" id="email" required placeholder="Ex: email@exemplo.com">
      </div>
      <div class="form-group">
        <label for="password">Palavra-passe *</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-submit">Entrar</button>
    </form>
    <a href="/register.html" class="btn-back">← Criar uma conta</a>
  </div>
</main>

<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</script>
</body>
</html>
