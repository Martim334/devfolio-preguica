<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – DevPortfolio</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/" class="logo">DevPortfolio</a>
            <div class="nav-links">
                <a href="/">Início</a>
                <a href="/login">Login</a>
                <a href="/register">Registo</a>
            </div>
        </nav>
    </header>

    <main class="form-container">
        <div class="form-card">
            <h2>Área de Autenticação</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required placeholder="formador@formador.com">
                </div>
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
            <a href="/register" class="btn-back">← Não tem conta? Criar conta</a>
        </div>
    </main>
</body>
</html>
