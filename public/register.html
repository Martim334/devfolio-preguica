<main class="auth-container">
  <div class="auth-card">
    <h2>Criar Conta</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Nome *</label>
        <input type="text" id="name" required placeholder="O seu nome">
      </div>
      <div class="form-group">
        <label for="email">E-mail *</label>
        <input type="email" id="email" required placeholder="seuemail@exemplo.com">
      </div>
      <div class="form-group">
        <label for="password">Palavra-passe *</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary">Registar</button>
    </form>
    <p class="auth-footer">Já tem conta? <a href="/login.html">Iniciar Sessão</a></p>
  </div>
</main>
