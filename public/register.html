<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo – DevPortfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/" class="logo">DevPortfolio</a>
            <div class="nav-links">
                <a href="/">Início</a>
                <a href="/login">Login</a>
                <a href="/register">Registo</a>
            </div>
        </nav>
    </header>

    <main class="form-container">
        <div class="form-card">
            <h2>Criar Conta</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Nome Completo *</label>
                    <input type="text" id="name" required placeholder="Martim Costa">
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required placeholder="martim@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="bio">Pequena Biografia (Opcional)</label>
                    <textarea id="bio" placeholder="Desenvolvedor Web Full-Stack..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Criar Conta</button>
            </form>
            <a href="/login" class="btn-back">← Já tem conta? Faz Login aqui</a>
        </div>
    </main>
</body>
</html>
